name: git-rock
base: bare
build-base: ubuntu@26.04
version: '2.53'
summary: A lightweight Git package for version control and CI/CD.
description: |
    This project provides a lightweight Git package for version control 
    and CI/CD. It includes essential Git binaries and HTTP support.

platforms:
    amd64:
    arm64:
    ppc64el:
    s390x:

parts:
    git:
        plugin: nil
        stage-packages:
            - base-files_base
            - base-files_chisel
            - base-files_release-info
            - ca-certificates_data
            - git_bins
            - git_daemon
            - git_http-support  

    deb-security-manifest:
        plugin: make
        source: https://github.com/canonical/rocks-security-manifest
        source-type: git
        source-branch: main
        override-prime: gen_manifest
