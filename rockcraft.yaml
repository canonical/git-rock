name: git
base: bare
# TODO: Update once 26.10 is stabilized
build-base: devel
version: '2.55'
summary: A lightweight Git package for version control and CI/CD.
description: |
    This project provides a lightweight Git package for version control 
    and CI/CD. It includes essential Git binaries and HTTP support.

platforms:
    amd64:
    arm64:
    ppc64el:
    s390x:

parts:
    git:
        plugin: nil

        # TODO: Uncomment once 26.10 is stabilized
        # stage-packages:
        #     - base-files_base
        #     - base-files_chisel
        #     - base-files_release-info
        #     - ca-certificates_data
        #     - git_daemon
        #     - git_http-support  

        # TODO: Remove once 26.10 is stabilized
        override-build: |
            craftctl default
            craftctl default
            chisel cut --release ubuntu-26.10 --root ${CRAFT_PART_INSTALL} \
              base-files_base \
              base-files_release-info \
              ca-certificates_data \
              git_daemon \
              git_http-support

    deb-security-manifest:
        plugin: make
        source: https://github.com/canonical/rocks-security-manifest
        source-type: git
        source-branch: main
        override-prime: gen_manifest
