project: git-rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-26.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests

    prepare: | #copies the image to the docker deamon
      sudo snap install docker

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft

      # Wait for docker daemon to come online
      sudo apt install --yes retry
      retry --times=10 --delay 2 -- docker images
      sudo apt remove --yes retry

      # Load the rock into docker
      sudo rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:git-rock:2.53

    restore: |
      docker image rm --force git-rock:2.53

exclude:
  - .git

kill-timeout: 1h
